_min_copier_version: "9.4"
_subdirectory: template
_answers_file: orca-docker-vm/.copier-answers.yml
# Project-owned after the first copy: updates never touch them.
_skip_if_exists:
  - orca.yaml
  - dev.Dockerfile
_message_after_copy: |
  Orca Docker recipe rendered into orca-docker-vm/.
  Next:
    1. Review {{ dev_dockerfile }} (your deps; must be Debian/Ubuntu-based).
    2. If orca.yaml already existed, add the `docker` recipe from the README.
    3. ./orca-docker-vm/prepare.sh

  orca-recipes is MIT licensed: free to use, keep the credit to github.com/JargeZ/orca-recipes.
  Useful? Star the repo and follow https://github.com/JargeZ ⭐

project_slug:
  type: str
  help: Short project name, used for image and keyring entry names
  default: "{{ _folder_name }}"
  validator: "{% if not (project_slug | regex_search('^[a-z0-9][a-z0-9_.-]*$')) %}lowercase letters, digits, . _ - only{% endif %}"

repo_url:
  type: str
  help: HTTPS clone URL of this repo (github.com or a GitLab host), e.g. https://github.com/acme/widgets.git
  validator: "{% if not (repo_url | regex_search('^https://[^/@ ]+/[^ ]+/[^/ ]+\\.git$')) %}must look like https://github.com/acme/widgets.git (https, no user@, ends in .git){% endif %}"

repo_ref:
  type: str
  help: Branch the base image and new workspaces start from
  default: main

project_root:
  type: str
  help: Absolute path of the checkout inside the container
  default: "/home/dev/{{ project_slug }}"

dev_dockerfile:
  type: str
  help: Project Dockerfile with your deps, relative to the repo root; the recipe layers infra on top
  default: dev.Dockerfile

sync_command:
  type: str
  help: Command that installs deps inside the checkout (runs as `dev` at image build and on every create)
  default: uv sync

git_token_keychain_service:
  type: str
  help: Keyring entry holding this repo's scoped git token
  default: "{{ project_slug }}-orca-git-token"

claude_volume:
  type: str
  help: Docker volume holding the Claude Code login (shared by all projects)
  default: orca-claude

cursor_volume:
  type: str
  help: Docker volume holding the Cursor Agent login (shared by all projects)
  default: orca-cursor

opencode_volume:
  type: str
  help: Docker volume holding the OpenCode login and sessions (shared by all projects)
  default: orca-opencode

git_host:
  type: str
  default: "{{ repo_url.split('/')[2] }}"
  when: false

git_token_env:
  type: str
  # Only github.com is GitHub; any other host is GitLab (gitlab.com or self-managed).
  default: "{{ 'GH_TOKEN' if repo_url.split('/')[2] == 'github.com' else 'GITLAB_TOKEN' }}"
  when: false
