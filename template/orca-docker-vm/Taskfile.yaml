# Included from the project's Taskfile as `orca:` (see the orca-recipes README).
version: '3'

tasks:
  setup:
    desc: Provision everything the "Local Docker" Orca recipe needs (idempotent)
    interactive: true
    cmds:
      - '{{.TASKFILE_DIR}}/prepare.sh'

  claude-login:
    desc: Log Claude Code in once into the shared Docker volume (no-op if the login works, FORCE=1 to redo)
    interactive: true
    cmds:
      - '{{.TASKFILE_DIR}}/claude-login.sh'

  cursor-login:
    desc: Log Cursor Agent in once into the shared Docker volume (no-op if the login works, FORCE=1 to redo)
    interactive: true
    cmds:
      - '{{.TASKFILE_DIR}}/cursor-login.sh'

  opencode-login:
    desc: Log OpenCode in once into the shared Docker volume (no-op if a login exists, FORCE=1 to redo)
    interactive: true
    cmds:
      - '{{.TASKFILE_DIR}}/opencode-login.sh'

  git-token:
    desc: Store a git token scoped to this repo in the host keyring (no-op if present, FORCE=1 to replace)
    interactive: true
    cmds:
      - '{{.TASKFILE_DIR}}/git-token-setup.sh'

  base-image:
    desc: Build the base Docker image (dev.Dockerfile + infra + repo + deps); rerun after either Dockerfile or deps change
    cmds:
      - '{{.TASKFILE_DIR}}/docker-base-image.sh'

  check:
    desc: End-to-end self-test of the docker recipe (create + destroy)
    cmds:
      - orca vm recipe doctor docker --repo-path "{{.ROOT_DIR}}" --provision --json | jq -e '.ok' >/dev/null

  update:
    desc: Pull the latest recipe template (copier 3-way merge); extra args after --, e.g. `-- --vcs-ref v1.2.0`
    cmds:
      - '{{.TASKFILE_DIR}}/update.sh {{.CLI_ARGS}}'
